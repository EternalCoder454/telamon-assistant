[workspace]
resolver = "3"
members = ["crates/voice-core", "apps/telamon-assistant"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/telamon-assistant"
rust-version = "1.92"

[workspace.dependencies]
# The Telamon framework crates (startup, settings, logging, crash reports).
# Telamon.Ui is not pinned here: it is the installed telamon-ui package.
telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.10" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
