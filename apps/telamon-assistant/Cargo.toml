[package]
name = "telamon-assistant"
description = "Telamon: the voice assistant of Telamon OS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_assistant"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
voice-core = { path = "../../crates/voice-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log = { version = "0.4", features = ["std"] }
anyhow = "1"

[build-dependencies]
cxx-qt-build = "0.10"
