[package]
name = "voice-core"
description = "Telamon's voice pipeline: wake word, VAD, speech to text, tools, model, speech"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["vulkan"]
# whisper.cpp on the GPU through Vulkan (falls back to the CPU without a device).
vulkan = ["whisper-rs/vulkan"]

[dependencies]
# ONNX Runtime from the system (Fedora's onnxruntime), loaded at run time.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
whisper-rs = "0.15"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
log = "0.4"
anyhow = "1"
env_logger = { version = "0.11", default-features = false }

[[bin]]
name = "telamon-voice"
path = "src/bin/telamon-voice.rs"
